[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-track-fusion-kernel"
version = "1.0.0"
description = "Dual-Use Decentralized Covariance Intersection (CI) & Collaborative Multi-Robot SLAM Fusion Engine defeating data incest with golden-section trace minimization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Ahmed Hassan", email = "ahmed.hassan.aah@gmail.com" }
]
keywords = [
    "defense-tech",
    "sensor-fusion",
    "covariance-intersection",
    "data-incest",
    "radar-tracking",
    "electronic-warfare",
    "slam",
    "agv-robotics",
    "warehouse-automation",
    "dual-use",
    "sovereignty",
    "edge-computing",
    "hard-real-time"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Security"
]

[project.scripts]
distributed-track-fusion-kernel = "cli:main"
